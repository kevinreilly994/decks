databases:
  - name: decks-db
    databaseName: decks
    user: decks
    plan: free

services:
  - type: web
    name: decks
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: decks-db
          property: connectionString
      - key: DECKS_SEED_DEMO
        value: "1"
      - key: DJANGO_SUPERUSER_USERNAME
        value: kevin
      - key: DJANGO_SUPERUSER_EMAIL
        value: kevinreilly994@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
